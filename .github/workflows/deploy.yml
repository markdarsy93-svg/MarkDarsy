name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch original photos and video (only those not yet in the repo)
        run: |
          added=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -s "site/$f" ]; then
              mkdir -p "site/$(dirname "$f")"
              for host in https://palmjebelali-resale.com https://dubai-luxury-villas.markdarsy93.chatgpt.site; do
                if curl -fsSL --retry 3 -o "site/$f" "$host/$f"; then echo "fetched $f from $host"; added=1; break; fi
              done
              [ -s "site/$f" ] || { echo "::warning::could not fetch $f"; rm -f "site/$f"; }
            fi
          done < tools/assets.txt
          echo "added=$added" >> "$GITHUB_ENV"

      - name: Commit fetched assets
        if: env.added == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/images site/videos
          git commit -m "Add original site photos and video [skip ci]" || true
          git push || true

      - name: Build pages
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: python3 gen.py

      - name: Layout check (mobile + desktop screenshots)
        run: |
          cd site && python3 -m http.server 8080 >/dev/null 2>&1 &
          npm i --no-save playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p shots && sleep 1 && node tools/shots.mjs
      - name: Save layout screenshots to the qa-shots branch
        run: |
          cp -r shots /tmp/shots
          cd /tmp/shots
          git init -q -b qa-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Layout screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" qa-shots

      - name: Rebuild for preview sub-path (only until the custom domain is live)
        if: vars.CUSTOM_DOMAIN == ''
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          git checkout -- site/assets/site.css
          python3 gen.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
